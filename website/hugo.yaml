# Hugo configuration for the National Lottery Number Generator public site.
baseURL: https://lottery.markheydon.me.uk/
defaultContentLanguage: en
title: National Lottery Number Generator
enableGitInfo: true
enableEmoji: true
disableKinds:
  - taxonomy
  - term

languages:
  en:
    label: English (UK)
    locale: en-GB
    weight: 1

module:
  imports:
    - path: github.com/nunocoracao/blowfish/v3

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menus:
  main:
    - name: Guides
      pageRef: /guides
      weight: 1
    - name: Open app
      url: https://mheydon73-lottery-generator.azurewebsites.net/
      weight: 2
      pre: arrow-up-right-from-square
    - name: GitHub
      url: https://github.com/markheydon/national-lottery-generator
      weight: 3
      pre: github

params:
  description: Generate playful UK National Lottery number suggestions for entertainment only.
  colorScheme: ocean
  enableSearch: true
  enableCodeCopy: true
  mainSections:
    - guides

  header:
    layout: floating

  footer:
    showCopyright: true
    showThemeAttribution: true
    showAppearanceSwitcher: true
    showScrollToTop: true

  homepage:
    layout: landing
    showRecent: false

  list:
    showBreadcrumbs: true
    showSummary: false
    cardView: true
    orderByWeight: true

  article:
    showDate: false
    showReadingTime: false
    showWordCount: false
    showTaxonomies: false
    showBreadcrumbs: true
    showTableOfContents: true
    showEdit: true
    editURL: https://github.com/markheydon/national-lottery-generator/edit/main/website/content
    editAppendPath: true
    showPagination: true