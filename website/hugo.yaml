# Hugo configuration for the National Lottery Number Generator public site.
baseURL: https://lottery.markheydon.me.uk/
defaultContentLanguage: en
languages:
  en:
    label: English (UK)
    locale: en-GB
    weight: 1
title: National Lottery Number Generator
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

caches:
  images:
    dir: :cacheDir/images

menu:
  main:
    - name: Guides
      pageRef: /guides
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: Open app
      weight: 3
      url: https://mheydon73-lottery-generator.azurewebsites.net/
      params:
        icon: external-link
    - name: GitHub
      weight: 4
      url: https://github.com/markheydon/national-lottery-generator
      params:
        icon: github

params:
  description: Generate playful UK National Lottery number suggestions for entertainment only.

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: https://github.com/markheydon/national-lottery-generator/edit/main/website/content