version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
    assignees:
      - markheydon
    groups:
      patch-and-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

