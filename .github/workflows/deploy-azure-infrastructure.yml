# Manual Bicep deployment for Azure App Service infrastructure (#194).
# Application CD (deploy-azure-webapp.yml) does not run this template.

name: Deploy Azure infrastructure (Bicep)

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Target resource group name
        required: true
        default: rg-mheydon73-lottery-generator
        type: string
      parameters_file:
        description: Bicep parameters file path
        required: true
        default: deploy/bicep/main.bicepparam
        type: string
      what_if_only:
        description: Run what-if only (no deployment)
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-infrastructure
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${{ inputs.resource_group }}" \
            --location uksouth \
            --output none

      - name: Bicep what-if
        run: |
          az deployment group what-if \
            --resource-group "${{ inputs.resource_group }}" \
            --template-file deploy/bicep/main.bicep \
            --parameters "${{ inputs.parameters_file }}"

      - name: Bicep deploy
        if: ${{ inputs.what_if_only == false }}
        run: |
          az deployment group create \
            --resource-group "${{ inputs.resource_group }}" \
            --template-file deploy/bicep/main.bicep \
            --parameters "${{ inputs.parameters_file }}" \
            --mode Incremental
