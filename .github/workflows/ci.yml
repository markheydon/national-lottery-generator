name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpmd

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install PHP dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Directory Permissions
        run: chmod -R 777 storage

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Run PHPUnit on PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHPUnit 8.3
        run: vendor/bin/phpunit

      - name: Run PHPUnit on PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: PHPUnit 8.4
        run: vendor/bin/phpunit

      - name: Run PHPUnit on PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: PHPUnit 8.5
        run: vendor/bin/phpunit

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright
        run: |
          npm ci --no-fund --no-audit
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npm run test:e2e:install
          else
            npx playwright install chromium
          fi

      - name: Run Playwright UI tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Run PHPMD
        run: phpmd src,templates,tests sarif codesize --reportfile phpmd-results.sarif
        continue-on-error: true
