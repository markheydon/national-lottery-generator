name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: phpmd

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install PHP dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Directory Permissions
        run: chmod -R 777 storage

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Run PHPUnit on PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: PHPUnit 8.3
        run: vendor/bin/phpunit

      - name: Run PHPUnit on PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: PHPUnit 8.4
        run: vendor/bin/phpunit

      - name: Run PHPUnit on PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: PHPUnit 8.5
        run: vendor/bin/phpunit

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm view @playwright/test@1.62.1 version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install @playwright/test@^1.62.1 --no-save
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi

      - name: Run Playwright UI tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Run PHPMD
        run: phpmd src,templates,tests sarif codesize --reportfile phpmd-results.sarif
        continue-on-error: true
